[workspace]
members = [
    "crates/firestone",
    "crates/firestone-core",
    "crates/firestone-init",
    "crates/firestone-initproto",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = { version = "=0.8.4", default-features = false, features = ["form", "http1", "json", "query", "tokio", "ws"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "=4.6.9"
console = "=0.16.4"
dialoguer = { version = "=0.12.0", default-features = false }
fatfs = { version = "=0.3.6", default-features = false, features = ["std", "alloc"] }
firestone-initproto = { path = "crates/firestone-initproto" }
flate2 = "=1.1.9"
fs2 = "0.4"
futures-util = { version = "=0.3.34", default-features = false, features = ["async-await", "std"] }
http-body-util = "=0.1.3"
hyper = { version = "=1.6.0", features = ["http1", "server"] }
hyperlocal = { version = "=0.9.1", default-features = false, features = ["server"] }
hyper-util = { version = "=0.1.17", default-features = false, features = ["tokio"] }
indicatif = "=0.18.6"
jiff = "0.2"
minijinja = { version = "=2.24.0", features = ["serde"] }
nix = { version = "0.30", features = ["fs", "hostname", "poll", "process", "signal", "socket", "term", "user"] }
owo-colors = "=4.4.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustix = { version = "1", features = ["param", "process", "pty", "termios"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
shlex = "2"
ssh-key = "0.6"
tar = { version = "=0.4.46", default-features = false }
tempfile = "3"
signal-hook = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "=0.1.17", default-features = false, features = ["sync"] }
tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["handshake"] }
toml = "0.8"
tower = { version = "=0.5.2", features = ["util"] }
tracing = "0.1"
unicode-width = "0.2"
url = "2"
wait-timeout = "0.2"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"

# SPEC §10.5/§17.2. `firestone-init` is a guest payload, so it is tuned for size
# rather than speed. Cargo accepts `opt-level` per package but not `lto` or
# `panic`, which are profile-wide settings; the standalone musl build in
# `build/firestone-init` supplies those on its own command line.
[profile.release.package.firestone-init]
opt-level = "z"

[profile.release.package.firestone-initproto]
opt-level = "z"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
