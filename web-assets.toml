# Third-party web assets vendored under crates/firestone/assets/ui/ and compiled
# into the executable. Firestone ships one file and the UI fetches nothing from a
# CDN at runtime, so every vendored byte is pinned here and hash-checked by
# crates/firestone/tests/release.rs.
#
# These pins do not belong in deps.toml: scripts/pin-deps.sh regenerates that
# manifest byte-for-byte from a fixed template and compares the result with cmp,
# so anything added there fails verification and is dropped by the next refresh.
#
# Web assets are architecture-independent, so each entry pins exactly one file
# instead of the per-architecture subtables deps.toml uses.
#
# Every entry carries: origin, path, sha256, license.
#   origin = "fetched"   also carries version, url, release_url, and the exact
#                        upstream bytes are reachable at url.
#   origin = "derived"   also carries derived_from and note, and is produced from
#                        another Firestone asset rather than downloaded.
#
# The set of entries must equal the files present under crates/firestone/assets/ui/
# minus the first-party sources Firestone authors itself: app.css, app.js, theme.js.
# Vendoring a new third-party file without pinning it here fails the test suite,
# and so does a pin whose file was deleted.
#
# Hashes are the SHA-256 of the file at path, lowercase hex, and were confirmed
# against a fresh download from url on 2026-09-01.
manifest_version = 1

[asset.htmx]
origin = "fetched"
version = "2.0.10"
release_url = "https://github.com/bigskysoftware/htmx/releases/tag/v2.0.10"
url = "https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.10/htmx.min.js"
path = "crates/firestone/assets/ui/htmx.min.js"
sha256 = "71ea67185bfa8c98c39d31717c6fce5d852370fcdfd129db4543774d3145c0de"
license = "0BSD"

# The ext build bundles the Idiomorph core and registers the htmx "morph"
# extension, so no separate idiomorph.min.js is vendored.
[asset.idiomorph-ext]
origin = "fetched"
version = "0.7.4"
release_url = "https://github.com/bigskysoftware/idiomorph/releases/tag/v0.7.4"
url = "https://cdn.jsdelivr.net/npm/idiomorph@0.7.4/dist/idiomorph-ext.min.js"
path = "crates/firestone/assets/ui/idiomorph-ext.min.js"
sha256 = "a6437e55b1b6a07bc421f0d230266a39399b6826c6ed19e0ed9c63b707444a5f"
license = "0BSD"

