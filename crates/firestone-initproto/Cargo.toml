[package]
name = "firestone-initproto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

# Deliberately minimal: this crate is linked into the static musl `firestone-init`
# payload as well as into `firestone-core`, so it may never grow a dependency
# that the guest binary cannot afford (SPEC §10.5).
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
