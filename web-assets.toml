# Firestone's own mark, not a third-party dependency. It is pinned here because
# it is vendored bytes rather than an authored source file, so the test suite
# treats it the same way as everything else under assets/ui/.
[asset.logo]
origin = "derived"
derived_from = "firestone-ui/assets/logo.svg"
path = "crates/firestone/assets/ui/logo.svg"
sha256 = "a33d725f63af33e93af05c76f3477a1fec1edb717a91a0b84eb93899ca325379"
license = "NOASSERTION"
note = "Byte-identical to the source except the <metadata> C2PA manifest element and the now-unused xmlns:c2pa attribute are removed, dropping 36119 bytes to 8361. NOASSERTION because the repository ships no LICENSE file; the artwork is Firestone's own and carries no upstream terms."
