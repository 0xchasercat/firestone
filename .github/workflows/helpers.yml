name: Static helper reproducibility

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/helpers.yml
      - build/helpers/**
      - deps.toml
      - scripts/build-helpers.sh
      - scripts/fetch-helper-inputs.sh
      - scripts/pin-deps.sh
  pull_request:
    paths:
      - .github/workflows/helpers.yml
      - build/helpers/**
      - deps.toml
      - scripts/build-helpers.sh
      - scripts/fetch-helper-inputs.sh
      - scripts/pin-deps.sh

permissions:
  contents: read

jobs:
  recipe-tests:
    name: Helper recipe tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check shell syntax
        run: |
          bash -n scripts/build-helpers.sh scripts/fetch-helper-inputs.sh scripts/pin-deps.sh
          sh -n build/helpers/build-in-container.sh
      - name: Lint shell recipes
        run: >-
          shellcheck
          scripts/build-helpers.sh
          scripts/fetch-helper-inputs.sh
          scripts/pin-deps.sh
          build/helpers/build-in-container.sh
          build/helpers/tests/test-build-scripts.sh
      - name: Run helper recipe tests
        run: build/helpers/tests/test-build-scripts.sh

  build:
    name: Native x86_64 static helpers
    needs: recipe-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Fetch and verify immutable inputs
        run: scripts/fetch-helper-inputs.sh --output-dir "$RUNNER_TEMP/helper-inputs"
      - name: Build twice without network
        run: >-
          scripts/build-helpers.sh
          --input-dir "$RUNNER_TEMP/helper-inputs"
          --output-dir "$RUNNER_TEMP/helper-output"
      - name: Check output checksums and host argv
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/helper-output"
          (cd "$output" && sha256sum -c SHA256SUMS)
          test "$("$output/passt" --version 2>/dev/null | sed -n '1p')" = \
            'passt 2025_02_17.a1e48a0'
          test "$("$output/qemu-img" --version | sed -n '1p')" = \
            'qemu-img version 8.2.2'
          test "$("$output/mkfs.ext4" -V 2>&1 | sed -n '1p')" = \
            'mke2fs 1.47.3 (8-Jul-2025)'

          smoke="$RUNNER_TEMP/passt-smoke"
          mkdir "$smoke"
          "$output/passt" \
            --foreground \
            --one-off \
            --vhost-user \
            --socket "$smoke/net.sock" \
            --log-file "$smoke/passt.log" \
            --tcp-ports none \
            --udp-ports none \
            --repair-path none 2>"$smoke/passt.stderr" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || :; wait "$pid" 2>/dev/null || :' EXIT
          ready=false
          for _ in $(seq 1 100); do
            if test -S "$smoke/net.sock"; then
              ready=true
              break
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.05
          done
          if [[ $ready == true ]]; then
            kill "$pid" 2>/dev/null || :
            wait "$pid" 2>/dev/null || :
            test -s "$smoke/passt.log"
          else
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid"
              wait "$pid" 2>/dev/null || :
              echo 'passt did not create its socket within 5 seconds' >&2
              exit 1
            fi
            status=0
            wait "$pid" || status=$?
            test "$status" -ne 0
            grep -Eq "Couldn't create user namespace|Failed to detach isolating namespaces" \
              "$smoke/passt.stderr"
            cat "$smoke/passt.stderr"
          fi
          trap - EXIT

          mkfs_smoke="$RUNNER_TEMP/mkfs-smoke"
          mkdir -p "$mkfs_smoke/tree/dir"
          printf 'firestone\n' >"$mkfs_smoke/tree/dir/file.txt"
          ln -s dir/file.txt "$mkfs_smoke/tree/link"
          ln "$mkfs_smoke/tree/dir/file.txt" "$mkfs_smoke/tree/hard"
          sudo mknod "$mkfs_smoke/tree/dev-null" c 1 3
          chmod 0741 "$mkfs_smoke/tree/dir/file.txt"
          sudo chown 12345:12345 "$mkfs_smoke/tree/dir/file.txt"
          sudo tar --numeric-owner --sort=name --format=gnu --mtime=@1739777376 \
            -cf "$mkfs_smoke/layer.tar" -C "$mkfs_smoke/tree" .
          "$output/mkfs.ext4" -F -t ext4 -d "$mkfs_smoke/layer.tar" -b 4096 \
            "$mkfs_smoke/out.img" 64M
          debugfs_bin=$(command -v debugfs || printf '%s\n' /usr/sbin/debugfs)
          "$debugfs_bin" -R 'stat dir/file.txt' "$mkfs_smoke/out.img" \
            >"$mkfs_smoke/file.stat" 2>/dev/null
          "$debugfs_bin" -R 'stat link' "$mkfs_smoke/out.img" \
            >"$mkfs_smoke/link.stat" 2>/dev/null
          "$debugfs_bin" -R 'stat dev-null' "$mkfs_smoke/out.img" \
            >"$mkfs_smoke/device.stat" 2>/dev/null
          grep -Eq 'Type: regular[[:space:]]+Mode:[[:space:]]+0741' "$mkfs_smoke/file.stat"
          grep -Eq 'User:[[:space:]]+12345[[:space:]]+Group:[[:space:]]+12345' "$mkfs_smoke/file.stat"
          grep -Eq 'Links:[[:space:]]+2' "$mkfs_smoke/file.stat"
          grep -Fq 'Fast link dest: "dir/file.txt"' "$mkfs_smoke/link.stat"
          grep -Fq 'Device major/minor number: 01:03' "$mkfs_smoke/device.stat"

          cat "$output/helpers.build-info"
